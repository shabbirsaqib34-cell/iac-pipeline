name: Verifiser innlogging mot Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verifiser:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az account show